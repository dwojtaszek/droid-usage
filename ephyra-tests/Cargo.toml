[package]
name = "droid-usage-ephyra"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
droid-usage = { path = ".." }
ephyra = { version = "0.0.1", features = ["coverage"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"

[profile.release]
debug-assertions = true
overflow-checks = true

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
as_conversions = "deny"
unwrap_in_result = "deny"
