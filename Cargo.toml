[package]
name = "droid-usage"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
comfy-table = "8.0.1"
console = "0.16.6"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
ureq = "3.5.0"

[dev-dependencies]
proptest = "1.12.0"
# Plain-text diffs for the golden comparisons. The color feature stays off, so failure output has no escape codes.
snapbox = { version = "1.2.2", default-features = false, features = ["diff"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_results = "deny"
ambiguous_negative_literals = "deny"
explicit_outlives_requirements = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
impl_trait_redundant_captures = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
single_use_lifetimes = "deny"
tail_expr_drop_order = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"

[lints.rustdoc]
all = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Fused multiply-add only trades precision for speed on some hardware. Cost estimates do not need it.
suboptimal_flops = "allow"
# Duplicate versions come from dependencies' own trees. cargo-deny checks them (see deny.toml).
multiple_crate_versions = "allow"
# Clippy's restriction group contradicts itself and is not meant to be enabled whole.
# Selected restriction lints that do not conflict with the rest:
# Numeric and cast safety:
as_conversions = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
non_zero_suggestions = "deny"
# Panic, slice, and error-handling safety:
dbg_macro = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
map_err_ignore = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
# Determinism, correctness, and resource hygiene:
clone_on_ref_ptr = "deny"
create_dir = "deny"
empty_drop = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
pathbuf_init_then_push = "deny"
precedence_bits = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
suspicious_xor_used_as_pow = "deny"
verbose_file_reads = "deny"
# Lint hygiene and code clarity:
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cfg_not_test = "deny"
cognitive_complexity = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
